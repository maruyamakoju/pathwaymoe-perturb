[project]
name = "pathwaymoe-perturb"
version = "0.1.0"
description = "GRN-sparsity-constrained pathway Mixture-of-Experts for virtual-cell perturbation prediction"
requires-python = ">=3.11"
dependencies = [
  "torch==2.5.1",
  "numpy==1.26.4", "pandas==2.2.2", "scipy==1.13.1",
  "scikit-learn==1.5.1", "scanpy==1.10.3", "anndata==0.10.8",
  "transformers==4.46.0", "huggingface_hub==0.26.2", "datasets==3.1.0",
  "rdkit==2024.3.5", "einops==0.8.0", "pyarrow==17.0.0", "polars==1.12.0",
  "matplotlib", "seaborn", "tqdm",
]

# native-Windows note: triton / flash-attn are intentionally omitted (Linux-only); the model uses
# PyTorch SDPA with two attention passes for mixed GRN-masked / dense heads. bitsandbytes is
# optional (8-bit optimizer) and auto-detected at train time.

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "slow: end-to-end or data-dependent tests",
  "needs_e_drive: requires E:\\vc_project_data data root",
  "gpu: requires a CUDA device",
]
